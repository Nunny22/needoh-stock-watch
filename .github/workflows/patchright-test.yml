name: Patchright Smyths Test
'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patchright-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/patchright-github-hosted
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Patchright Chromium
        run: npx patchright install chromium --with-deps
      - name: Check stock
        run: node src/monitor.js
      - name: Show Smyths result
        if: always()
        run: |
          grep -A 18 '"id": "smyths"' docs/status.json || true
