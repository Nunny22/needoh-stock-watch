name: NeeDoh Stock Watch - Manual Backup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check stock
        run: node src/monitor.js
      - name: Save dashboard state
        run: |
          git config user.name "needoh-stock-watch"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet || git commit -m "chore: update stock status"
          git push
