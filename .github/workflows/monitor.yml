name: NeeDoh Stock Watch - Redundant Backup
'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - test/patchright-github-hosted
    paths:
      - 'src/monitor.js'
      - 'config/retailers.json'
      - 'package.json'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: needoh-stock-watch
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx patchright install chromium --with-deps
      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/monitor.js
      - name: Show test result
        run: grep -A 18 '\"id\": \"smyths\"' docs/status.json || true
