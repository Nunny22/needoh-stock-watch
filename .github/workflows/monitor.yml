name: NeeDoh Stock Watch - Redundant Backup
'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/monitor.js'
      - 'config/retailers.json'
permissions:
  contents: write
concurrency:
  group: needoh-stock-watch
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/monitor.js
      - name: Save dashboard state
        run: |
          git config user.name "needoh-stock-watch"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet || git commit -m "chore: update backup stock status"
          git push
