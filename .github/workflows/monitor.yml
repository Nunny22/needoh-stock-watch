name: NeeDoh Stock Watch - Redundant Backup
'on':
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/monitor.js'
      - 'config/retailers.json'
      - 'package.json'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: needoh-stock-watch
  cancel-in-progress: true
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, needoh-monitor]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Node.js
        shell: powershell
        run: |
          $zip = "$env:RUNNER_TEMP\node.zip"
          $dir = "$env:RUNNER_TEMP\node22"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.20.0/node-v22.20.0-win-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $node = Join-Path $dir "node-v22.20.0-win-x64"
          $node | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/monitor.js
      - name: Save dashboard state
        shell: powershell
        run: |
          git config user.name "needoh-stock-watch"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update backup stock status"
            git push
          }
