<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeeDoh Stock Hunter</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#16181d}.w{max-width:900px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.c,.row{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.big{font-size:25px;font-weight:750}.muted{color:#667085;font-size:13px}.row{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr;gap:10px;margin:9px 0}.in_stock{color:#067647;font-weight:800}.out_of_stock{color:#b42318}.error{color:#b54708}a{color:inherit;font-weight:650}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row>*:nth-child(4){display:none}}</style><div class="w"><h1>NeeDoh Stock Hunter</h1><div id="stamp" class="muted">Loading…</div><div class="cards"><div class="c"><div class="muted">SYSTEM</div><div class="big">● Monitoring</div></div><div class="c"><div class="muted">RETAILERS</div><div id="count" class="big">—</div></div><div class="c"><div class="muted">SECURED</div><div id="secured" class="big">—</div></div></div><h2>Live retailer watch</h2><div id="list"></div></div><script>async function go(){try{const s=await fetch("status.json?"+Date.now()).then(r=>r.json());count.textContent=s.retailers.length;secured.textContent=s.secured+" / "+s.target;stamp.textContent=s.updatedAt?"Updated "+new Date(s.updatedAt).toLocaleString("en-GB"):"Awaiting first scan";list.innerHTML=s.retailers.map(r=>'<div class="row"><a href="'+r.url+'" target="_blank">'+r.name+'</a><b>£'+Number(r.price).toFixed(2)+'</b><span class="'+r.status+'">'+r.status.replaceAll("_"," ")+'</span><span class="muted">'+new Date(r.checkedAt).toLocaleTimeString("en-GB")+'</span></div>').join("")||'<div class="c">First scan has not run yet.</div>'}catch(e){list.innerHTML='<div class="c error">Dashboard data unavailable.</div>'}}go();setInterval(go,60000)</script>
