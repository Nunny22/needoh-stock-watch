<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeeDoh Stock Watch</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#15221c;font-family:system-ui,-apple-system,sans-serif}.w{max-width:720px;margin:auto;padding:18px 14px 50px}.hero{background:#13271f;color:#fff;border-radius:20px;padding:22px}.ey{font-size:11px;letter-spacing:.14em;font-weight:800;opacity:.7}h1{margin:5px 0 17px;font-size:28px}.health{font-weight:850}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#f5b942}.live .dot{background:#4ade80}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.box{background:#ffffff12;border:1px solid #ffffff18;border-radius:12px;padding:12px}.box b{display:block;font-size:22px}.box small,.last{font-size:12px;opacity:.72}.last{margin-top:12px}.shop{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e1e6e3;border-radius:14px;padding:14px;margin-top:9px}.shop strong{display:block;font-size:15px}.shop small{display:block;color:#727a76;margin-top:4px;font-size:12px}.trust{font-size:9px;font-weight:800}.actions{display:flex;align-items:center;gap:7px}.pill{font-size:10px;font-weight:900;padding:6px 8px;border-radius:999px;background:#eceeed;white-space:nowrap}.in_stock{background:#c9f4d8;color:#075c2c}.preorder{background:#cfe8ff;color:#064f8a}.out_of_stock{color:#555}.unknown,.watching,.pending{background:#fff0bd;color:#705500}.error{background:#ffdada;color:#8a1010}a{font-size:10px;font-weight:900;text-decoration:none;color:#15221c;border:1px solid #ccd2cf;border-radius:7px;padding:6px 8px}.note{font-size:11px;color:#7b827e;margin:14px 4px}.sectionTitle{margin:24px 3px 8px;font-size:13px;letter-spacing:.08em}.discovery{border-style:dashed}.signal{background:#e8e1ff;color:#49358a}.bad{color:#8a1010}@media(max-width:430px){.shop{align-items:flex-start}.actions{flex-direction:column;align-items:flex-end}}</style></head><body><main class="w"><section class="hero"><div class="ey">NEEDOH 2026 · UK STOCK WATCH</div><h1>Calendar Monitor</h1><div id="health" class="health"><i class="dot"></i>LOADING</div><div class="grid"><div class="box"><b id="stock">—</b><small>retailers purchasable / pre-order</small></div><div class="box"><b id="secured">0 / 10</b><small>calendars secured</small></div></div><div id="stamp" class="last">Loading live status…</div></section><section id="list"></section><h2 class="sectionTitle">👀 DISCOVERY / NEEDS VERIFICATION</h2><section id="discoveries"></section><div class="note">Stock labels are monitoring signals. Use VIEW to confirm availability and checkout with the retailer.</div></main><script>
const API="https://hcjqrvzmkchgcncoqzvl.supabase.co/functions/v1/needoh-status";
const labels={in_stock:"IN STOCK",preorder:"PRE-ORDER",out_of_stock:"OUT OF STOCK",unknown:"UNKNOWN",watching:"WATCHING",error:"ERROR",pending:"PENDING"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function go(){try{const q=await fetch(API+"?t="+Date.now(),{cache:"no-store"});if(!q.ok)throw Error(q.status);const s=await q.json();health.className="health"+(s.healthy?" live":"");health.innerHTML='<i class="dot"></i>'+(s.healthy?"MONITOR LIVE":"CHECK MONITOR");stock.textContent=s.retailers.filter(r=>r.status==="in_stock"||r.status==="preorder").length;secured.textContent=s.secured+" / "+s.target;stamp.textContent=s.updatedAt?"Last completed scan: "+new Date(s.updatedAt).toLocaleString("en-GB"):"Waiting for first scan";list.innerHTML=s.retailers.map(r=>{const p=r.price==null?"Price TBC":"£"+r.price.toFixed(2);const ck=r.checkedAt?new Date(r.checkedAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"Not checked";return '<article class="shop"><div><strong>'+esc(r.name)+'</strong><small>'+p+' · '+ck+'</small><small class="trust">'+esc(r.trust==="verified_distributor"?"VERIFIED DISTRIBUTOR":r.trust==="product_verified"?"VERIFIED":"MONITOR ONLY")+'</small></div><div class="actions"><span class="pill '+esc(r.status)+'">'+esc(labels[r.status]||r.status)+'</span><a href="'+esc(r.url)+'" target="_blank" rel="noopener">VIEW</a></div></article>'}).join("");discoveries.innerHTML=(s.discoveries||[]).length?(s.discoveries||[]).map(d=>{const p=d.price==null?"Price TBC":"£"+d.price.toFixed(2);const seen=d.lastSeen?new Date(d.lastSeen).toLocaleString("en-GB"):"";return '<article class="shop discovery"><div><strong>'+esc(d.name)+'</strong><small>'+p+' · '+esc(d.source)+' · '+esc(seen)+'</small><small class="trust">UNVERIFIED DISCOVERY</small></div><div class="actions"><span class="pill signal">'+esc(String(d.signal).replaceAll("_"," ").toUpperCase())+'</span><a href="'+esc(d.url)+'" target="_blank" rel="noopener">VIEW</a></div></article>'}).join(""):'<article class="shop discovery"><div><strong>No unverified discoveries</strong><small>New leads will appear here automatically.</small></div></article>'}catch(e){health.className="health";health.innerHTML='<i class="dot"></i>DASHBOARD DATA ERROR';stamp.textContent="Could not load live status";list.innerHTML='<article class="shop bad">Live data unavailable. Try refreshing.</article>'}}go();setInterval(go,60000);
</script></body></html>
